# Render blueprint. Deploys the prototype as a free web service in Frankfurt (EU).
# See DEPLOY.md for the step-by-step.
services:
  - type: web
    name: genelink-prototype
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
