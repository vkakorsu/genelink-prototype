# ---------------------------------------------------------------------------
# What the applicant holds (A5.4): two instruments, two issuers
# ---------------------------------------------------------------------------
outputs:
  - id: nema_access_permit
    label: NEMA access permit
    kind: permit
    issuer: National Environment Management Authority (NEMA)
    issuedInState: granted
    amendmentPolicy: new_application
    term:
      state: established
      marker: "§"
      value: One year
      citation: reg. 17(2)
    renewalsCapped:
      state: unknown
      marker: "?"
      note: >-
        "For a further period of one year only" does not say one renewal, and does not say indefinite
        renewal either. Two opposite inferences have been drawn from this sentence and neither is
        established. Carry the text and an open question. Model as unknown, never as a default. The two
        defaults produce opposite advice to the same applicant.
      citation: reg. 17(2)
      owner: NEMA question, routed to the Kenya escalation owner
      drives: true
    fee:
      state: established
      marker: "§"
      value: KSh 1,000,000 for a foreign commercial applicant, per locality
      citation: Second Schedule
    ircc:
      state: established
      marker: "§"
      value: Becomes the internationally recognised certificate of compliance on upload to the ABS Clearing-House
      citation: reg. 20(2)
    notes:
      - reg. 11(6) requires notification to NEMA and a new permit where purpose, locality or quantity changes. Both limbs.
  - id: nacosti_research_licence
    label: NACOSTI research licence
    kind: licence
    issuer: National Commission for Science, Technology and Innovation (NACOSTI)
    issuedInState: granted
    amendmentPolicy: new_application
    term:
      state: established
      marker: "§"
      value: One year
      citation: NACOSTI schedule
    renewalsCapped:
      state: unknown
      marker: "?"
      note: Not researched for the research licence.
      owner: NACOSTI question, routed to the Kenya escalation owner
    fee:
      state: unknown
      marker: "?"
      note: Contradictory sources. Schedule shows US$500 for individuals and KES 20,000 for private institutions with a dash in foreign columns. A 2024 news post quotes US$10,000.
      owner: NACOSTI schedule confirmation, routed to the Kenya escalation owner

changeOfIntent:
  whatCounts:
    state: established
    marker: "§"
    value: A change in purpose, locality or quantity
    citation: reg. 11(6)
  consequence:
    state: established
    marker: "§"
    value: Notify NEMA and apply for a new permit. Both limbs, not one. reg. 18(3) variation is not an alternative route.
    citation: reg. 11(6); reg. 18(3)
  policy: new_application

# ---------------------------------------------------------------------------
# A5 · the eight variables
# ---------------------------------------------------------------------------
variables:
  whoMayApply: { state: "established", marker: "§", value: "Local institutional affiliation required for non-Kenyans only. The requirement is conditional on citizenship.", citation: "A5.1" }
  trigger: { state: "established", marker: "§", value: "Access and utilisation, including material held ex situ.", citation: "A5.2" }
  orderOfConsent: { state: "established", marker: "§", value: "Consent, mutually agreed terms and a benefit-sharing agreement accompany the application itself.", citation: "reg. 11(4)" }
  applicantHolds: { state: "established", marker: "§", value: "Two instruments from two issuers, a NEMA access permit and a NACOSTI research licence, with different fees and durations.", citation: "A5.4" }
  clocks: { state: "established", marker: "§", value: "30 working days from receipt, with publication and comment contemplated before determination.", citation: "A5.5" }
  durationRenewal: { state: "established", marker: "§", value: "One year, renewable. Whether renewals are capped is unresolved (see outputs).", citation: "reg. 17(2)" }
  transferExport: { state: "established", marker: "§", value: "A Sixth Schedule agreement filed with NEMA. A holotype remains in Kenya. Declaration at the port of departure.", citation: "reg. 21" }
  postPermitLifecycle: { state: "established", marker: "§", value: "Duties carried in permit conditions.", citation: "reg. 18(2)" }

# ---------------------------------------------------------------------------
# A6 · the nine obligation classes (recorded now, run in phase two, R10)
# ---------------------------------------------------------------------------
obligationClasses:
  - number: 1
    name: Records and retention
    note: >-
      Appendix B left duty_exists and what_must_be_recorded unconfirmed against the Gazette text. The Kenya
      Law consolidated text of LN 68 (retrieved 22 September 2026) supplies both in reg. 18(2)(a) and (b).
      They are carried as GENE-LINK's reading, not as established law, until Landscape Alliance's own
      verification round confirms them. Nothing is built on them.
    fields:
      duty_exists: { state: "inferred", marker: "▸", value: "Yes, as standing permit conditions. reg. 18(2)(a) requires duplicates and holotypes of all genetic resources collected to be deposited with the Authority and other relevant stakeholders; reg. 18(2)(b) requires the records of all intangible components of biological material collected to be deposited with the Authority; reg. 18(2)(e) to (g) carry the reporting duties in Class 2.", citation: "reg. 18(2)(a), (b), (e) to (g)", note: "Retrieved from the Kenya Law consolidated text on 22 September 2026. Pending Landscape Alliance's verification round before it becomes established." }
      what_must_be_recorded: { state: "inferred", marker: "▸", value: "Duplicates and holotypes of all genetic resources collected (reg. 18(2)(a)) and the records of all intangible components of biological material collected (reg. 18(2)(b)), as standing conditions of every permit. reg. 21(5) adds, at export, a holotype deposited either with the entity granting the material transfer agreement or with a depository gazetted by the Authority. How the deposit duty applies to extracts, microbial isolates and other non-taxonomic material remains an open design question.", citation: "reg. 18(2)(a), (b); reg. 21(5)", note: "Retrieved from the Kenya Law consolidated text on 22 September 2026. Pending Landscape Alliance's verification round." }
      filing_deadline: { state: "unknown", marker: "?", note: "Not researched.", owner: "Kenya escalation owner" }
      retention_period: { state: "unknown", marker: "?", note: "Not researched.", owner: "Kenya escalation owner" }
      filed_with: { state: "established", marker: "§", value: "NEMA" }
  - number: 2
    name: Periodic reporting
    fields:
      duty_exists: { state: "established", marker: "§", value: "Yes, reg. 18(2) standing conditions", citation: "reg. 18(2)" }
      frequency: { state: "established", marker: "§", value: "Biannual and annual. Both, not either." }
      report_contents: { state: "established", marker: "§", value: "Includes disclosure of all discoveries to NEMA" }
      submitted_to: { state: "established", marker: "§", value: "NEMA" }
      default_alterable: { state: "unknown", marker: "?", note: "Not established.", owner: "Kenya escalation owner" }
      tk_act_notifications: { state: "established", marker: "§", value: "s.25(2) owners notify the Cabinet Secretary of every authorisation agreement. s.22(3) written arrangements go to the Cabinet Secretary and the county executive committee member.", citation: "TK Act ss.22(3), 25(2)" }
  - number: 3
    name: Payment cycle
    fields:
      duty_exists: { state: "established", marker: "§", value: "Yes, set by the mutually agreed terms on the Fifth Schedule model form", citation: "reg. 12(4)" }
      basis: { state: "established", marker: "§", value: "As negotiated in the MAT" }
      rate_copyright: { state: "established", marker: "§", value: "15% royalty", citation: "Fifth Schedule Art. 8.4" }
      rate_other: { state: "established", marker: "§", value: "Minimum 10%", citation: "Fifth Schedule Art. 8.4" }
      equity: { state: "established", marker: "§", value: "50:50 venture ownership, conditional on commercialisation. Not a general rule.", citation: "Fifth Schedule Art. 8.5" }
      rates_negotiable: { state: "unknown", marker: "?", note: "The numbers are real. Their status is not. Do not model them as editable defaults, and do not model them as immutable rates.", owner: "NEMA question", drives: true }
      calculation_point: { state: "unknown", marker: "?", note: "Not researched.", owner: "Kenya escalation owner" }
      payment_deadline: { state: "unknown", marker: "?", note: "Not researched.", owner: "Kenya escalation owner" }
      application_fee: { state: "established", marker: "§", value: "KSh 1,000,000 for a foreign commercial applicant, per locality", citation: "Second Schedule" }
      research_licence_fee: { state: "unknown", marker: "?", note: "Contradictory sources (US$500, KES 20,000, US$10,000). The one-year duration is established.", owner: "NACOSTI confirmation" }
  - number: 4
    name: Change-triggered re-registration
    fields:
      what_counts_as_change: { state: "established", marker: "§", value: "Purpose, locality or quantity", citation: "reg. 11(6)" }
      consequence: { state: "established", marker: "§", value: "Notify NEMA and apply for a new permit. Both limbs." }
      authority: { state: "established", marker: "§", value: "NEMA" }
      deadline: { state: "unknown", marker: "?", note: "Not researched.", owner: "Kenya escalation owner" }
      variation_power: { state: "established", marker: "§", value: "reg. 18(3) is a general power to vary. It is not an alternative route around reg. 11(6) and must not be offered as one.", citation: "reg. 18(3)" }
  - number: 5
    name: Renewal
    note: Kenya is the case the three-state enum exists for. A renewal-probe service must carry renewals_capped = unknown and surface it.
    fields:
      term_exists: { state: "established", marker: "§", value: "Yes" }
      term_length: { state: "established", marker: "§", value: "One year", citation: "reg. 17(2)" }
      renewal_length: { state: "established", marker: "§", value: "A further period of one year", citation: "reg. 17(2)" }
      renewals_capped: { state: "unknown", marker: "?", note: "Two opposite inferences drawn from the same sentence. Neither is established.", citation: "reg. 17(2)", owner: "NEMA question", drives: true }
      notice_window: { state: "unknown", marker: "?", note: "Not researched.", owner: "Kenya escalation owner" }
      decided_by: { state: "established", marker: "§", value: "NEMA" }
      evidence_required: { state: "unknown", marker: "?", note: "Not researched.", owner: "Kenya escalation owner" }
      on_lapse: { state: "unknown", marker: "?", note: "Not researched.", owner: "Kenya escalation owner" }
  - number: 6
    name: Transfer control
    fields:
      instrument_at_application: { state: "established", marker: "§", value: "A material transfer agreement, unqualified on the commercial route, even where nothing leaves Kenya. An application document, not an authorisation to transfer.", citation: "reg. 11(4)(d)" }
      instrument_at_export: { state: "established", marker: "§", value: "Sixth Schedule form, filed with NEMA", citation: "reg. 21(1), 21(3)" }
      retained_in_country: { state: "established", marker: "§", value: "A holotype remains in Kenya. Application to extracts and isolates is an open design question.", citation: "reg. 21(5)" }
      border_declaration: { state: "established", marker: "§", value: "Declare at the port of departure and produce the agreement", citation: "reg. 21(4)" }
      wildlife_export: { state: "established", marker: "§", value: "KWS export permit. KWS handles export and CITES. Research permits are WRTI's." }
      phytosanitary: { state: "established", marker: "§", value: "KEPHIS, conditional on the importing country's requirements for that material" }
      tk_related_articles: { state: "established", marker: "§", value: "s.37(9) makes unauthorised export for non-traditional use an offence whether or not the use is commercial", citation: "TK Act s.37(9)" }
  - number: 7
    name: Intellectual-property checkpoints
    fields:
      pre_transfer_duty: { state: "established", marker: "§", value: "Cabinet Secretary approval for specified transfers of shared IP and for applications to transfer IP rights based on Kenyan traditional knowledge", citation: "TK Act s.35(3) to (6)" }
      sequence: { state: "established", marker: "§", value: "Before assignment, licensing or export of the IP, not after" }
      checkpoint_bodies: { state: "established", marker: "§", value: "The Cabinet Secretary. No patent-office checkpoint was located on the genetic-resource side." }
      notification_deadline: { state: "unknown", marker: "?", note: "Not researched.", owner: "Kenya escalation owner" }
      consequence_of_omission: { state: "unknown", marker: "?", note: "Not researched.", owner: "Kenya escalation owner" }
  - number: 8
    name: Terminal states
    note: >-
      Appendix B left revocation and what_must_be_surrendered unresearched. The Kenya Law consolidated text of
      LN 68 (retrieved 22 September 2026) supplies both in reg. 19 and reg. 11(8). They are carried as
      GENE-LINK's reading until Landscape Alliance's verification round confirms them. The regulator state
      machine above does not yet carry suspended, cancelled or revoked states, because a state is a business
      rule and a ▸ value must not become one without legal review. Whether it gains them is an open question
      on this file.
    fields:
      states: { state: "established", marker: "§", value: "Granted, refused, varied. Refusal carries a statutory appeal path.", citation: "reg. 18(3)" }
      who_triggers: { state: "established", marker: "§", value: "NEMA" }
      processing_clock: { state: "established", marker: "§", value: "30 working days from receipt, with publication and comment contemplated before determination" }
      revocation: { state: "inferred", marker: "▸", value: "The Authority may suspend, cancel or revoke a permit where the holder contravenes the Act, the Regulations, a permit condition, or the terms of any agreement concluded pursuant to the grant (reg. 19(1)). Written notice of intention first, and a reasonable opportunity to make representations within thirty working days of that notice (reg. 19(2)); written reasons on the decision (reg. 19(3)). Where a holder contravenes the permit's terms and conditions, cancellation is mandatory: the Authority 'shall cancel' (reg. 11(8)). Three further terminal states, suspended, cancelled and revoked, each with a thirty-working-day representation clock.", citation: "reg. 19(1) to (3); reg. 11(8)", note: "Retrieved from the Kenya Law consolidated text on 22 September 2026. Pending Landscape Alliance's verification round before it becomes established or drives a state." }
      what_must_be_surrendered: { state: "inferred", marker: "▸", value: "On notification of suspension, cancellation or revocation the permit holder shall immediately surrender to the Authority the access permit, all research results and related documents, and the accessed biological resource (reg. 19(4)). The same pattern as Malaysia s.28: results and documents go back, not only the permit.", citation: "reg. 19(4)", note: "Retrieved from the Kenya Law consolidated text on 22 September 2026. Pending Landscape Alliance's verification round." }
      agreement_nullity: { state: "unknown", marker: "?", note: "TK Act s.35(2) makes unregistered agreements null and void, but no implementing regulations were located on Kenya Law as of 13 Aug 2026, so the registration on which validity depends has no published procedure.", citation: "TK Act s.35(2)", owner: "Kenya escalation owner", drives: true }
  - number: 9
    name: Standing attribution
    fields:
      duty_exists: { state: "established", marker: "§", value: "Yes", citation: "TK Act s.11" }
      applies_to: { state: "established", marker: "§", value: "Acknowledge the owner, indicate the source and where possible the origin, and respect cultural values" }
      duration: { state: "established", marker: "§", value: "Standing. The authorised-user agreement does not discharge it." }
      consequence_of_omission: { state: "unknown", marker: "?", note: "Not researched.", owner: "Kenya escalation owner" }

