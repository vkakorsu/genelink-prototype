      what_must_be_recorded: { state: "unknown", marker: "?", note: "A holotype must remain in Kenya on export under reg. 21(5). Whether a broader duplicate-deposit duty exists is unverified.", owner: "Kenya escalation owner" }
      filing_deadline: { state: "unknown", marker: "?", note: "Not researched.", owner: "Kenya escalation owner" }
      retention_period: { state: "unknown", marker: "?", note: "Not researched.", owner: "Kenya escalation owner" }
      filed_with: { state: "established", marker: "§", value: "NEMA" }
  - number: 2
    name: Periodic reporting
    fields:
      duty_exists: { state: "established", marker: "§", value: "Yes, reg. 18(2) standing conditions", citation: "reg. 18(2)" }
      frequency: { state: "established", marker: "§", value: "Biannual and annual. Both, not either." }
      report_contents: { state: "established", marker: "§", value: "Includes disclosure of all discoveries to NEMA" }
      submitted_to: { state: "established", marker: "§", value: "NEMA" }
      default_alterable: { state: "unknown", marker: "?", note: "Not established.", owner: "Kenya escalation owner" }
      tk_act_notifications: { state: "established", marker: "§", value: "s.25(2) owners notify the Cabinet Secretary of every authorisation agreement. s.22(3) written arrangements go to the Cabinet Secretary and the county executive committee member.", citation: "TK Act ss.22(3), 25(2)" }
  - number: 3
    name: Payment cycle
    fields:
      duty_exists: { state: "established", marker: "§", value: "Yes, set by the mutually agreed terms on the Fifth Schedule model form", citation: "reg. 12(4)" }
      basis: { state: "established", marker: "§", value: "As negotiated in the MAT" }
      rate_copyright: { state: "established", marker: "§", value: "15% royalty", citation: "Fifth Schedule Art. 8.4" }
      rate_other: { state: "established", marker: "§", value: "Minimum 10%", citation: "Fifth Schedule Art. 8.4" }
      equity: { state: "established", marker: "§", value: "50:50 venture ownership, conditional on commercialisation. Not a general rule.", citation: "Fifth Schedule Art. 8.5" }
      rates_negotiable: { state: "unknown", marker: "?", note: "The numbers are real. Their status is not. Do not model them as editable defaults, and do not model them as immutable rates.", owner: "NEMA question", drives: true }
