      applies_to: { state: "established", marker: "§", value: "Acknowledge the owner, indicate the source and where possible the origin, and respect cultural values" }
      duration: { state: "established", marker: "§", value: "Standing. The authorised-user agreement does not discharge it." }
      consequence_of_omission: { state: "unknown", marker: "?", note: "Not researched.", owner: "Kenya escalation owner" }

