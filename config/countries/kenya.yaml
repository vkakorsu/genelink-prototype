openQuestions:
  - id: ln68_in_force
    question: Whether Legal Notice 68 of 2025 is in force
    affects: The premise of the entire Kenya flow
    reg: { state: "unknown", marker: "?", note: "Parliament recorded approval subject to a corrigendum that has not been found. A second tracker gives a different date and wording. LN 19 of 2025 is textually identical.", owner: "NEMA" }
  - id: renewals_capped
    question: Whether renewals are capped
    affects: Renewal service behaviour. The two available defaults give the same applicant opposite advice.
    reg: { state: "unknown", marker: "?", citation: "reg. 17(2)", owner: "NEMA", drives: true }
  - id: per_locality_permits
    question: Whether a per-locality fee implies per-locality permits
    affects: Cost modelling and the number of applications a multi-site project generates
    reg: { state: "unknown", marker: "?", citation: "reg. 15(1); Second Schedule", owner: "NEMA" }
  - id: rates_negotiable
    question: Whether the model agreement's rates are negotiable
    affects: Whether the platform presents them as editable defaults or fixed rates. Presently neither can be justified.
    reg: { state: "unknown", marker: "?", citation: "Fifth Schedule Art. 8.4", owner: "NEMA", drives: true }
  - id: nacosti_fee
    question: The NACOSTI research licence fee
    affects: Fee display
    reg: { state: "unknown", marker: "?", owner: "NACOSTI" }
  - id: tk_registration_procedure
    question: The registration procedure on which TK Act s.35(2) validity depends
    affects: Whether an authorised-user agreement can be made valid at all
    reg: { state: "unknown", marker: "?", citation: "TK Act s.35(2)", owner: "Cabinet Secretary", drives: true }
  - id: sectoral_clearance_layer
    question: Whether GENE-LINK serves plant genetic resources for food and agriculture at all, and if so through which pathway, given that reg. 4(2)(b) excludes plant-breeder material under the Seeds and Plant Varieties Act and the ITPGRFA from LN 68, and practitioner input routes it to a KALRO standard material transfer agreement
    affects: The early branch on material type in the Kenya intake, before the PIC, MAT and NEMA sequence. Running such material through the LN 68 flow would instruct the user wrongly and the platform has no configured pathway for it, so the intake asks, a yes escalates at scope, and an unanswered question holds eligibility.
    reg: { state: "unknown", marker: "?", note: "The exclusion is on the face of reg. 4(2)(b) (Kenya Law consolidated text, retrieved 22 September 2026, pending Landscape Alliance's verification round). The KALRO SMTA routing and the sectoral clearance layer (KWS/KFS/KeFS, KEPHIS, DVS, MoH, NMK) are practitioner input (A9) pending NEMA follow-up. Whether PGRFA is in GENE-LINK's scope is a product decision for Landscape Alliance.", citation: "reg. 4(2)(b); Appendix B, A9", owner: "Landscape Alliance for scope; NEMA for routing" }
  - id: gazette_recheck
