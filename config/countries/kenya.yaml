      wildlife_export: { state: "established", marker: "§", value: "KWS export permit. KWS handles export and CITES. Research permits are WRTI's." }
      phytosanitary: { state: "established", marker: "§", value: "KEPHIS, conditional on the importing country's requirements for that material" }
      tk_related_articles: { state: "established", marker: "§", value: "s.37(9) makes unauthorised export for non-traditional use an offence whether or not the use is commercial", citation: "TK Act s.37(9)" }
  - number: 7
    name: Intellectual-property checkpoints
    fields:
      pre_transfer_duty: { state: "established", marker: "§", value: "Cabinet Secretary approval for specified transfers of shared IP and for applications to transfer IP rights based on Kenyan traditional knowledge", citation: "TK Act s.35(3) to (6)" }
      sequence: { state: "established", marker: "§", value: "Before assignment, licensing or export of the IP, not after" }
      checkpoint_bodies: { state: "established", marker: "§", value: "The Cabinet Secretary. No patent-office checkpoint was located on the genetic-resource side." }
