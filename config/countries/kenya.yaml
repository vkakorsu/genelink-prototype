      payment_deadline: { state: "unknown", marker: "?", note: "Not researched.", owner: "Kenya escalation owner" }
      application_fee: { state: "established", marker: "§", value: "KSh 1,000,000 for a foreign commercial applicant, per locality", citation: "Second Schedule" }
      research_licence_fee: { state: "unknown", marker: "?", note: "Contradictory sources (US$500, KES 20,000, US$10,000). The one-year duration is established.", owner: "NACOSTI confirmation" }
  - number: 4
    name: Change-triggered re-registration
    fields:
      what_counts_as_change: { state: "established", marker: "§", value: "Purpose, locality or quantity", citation: "reg. 11(6)" }
