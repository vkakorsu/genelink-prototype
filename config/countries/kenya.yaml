      decided_by: { state: "established", marker: "§", value: "NEMA" }
      evidence_required: { state: "unknown", marker: "?", note: "Not researched.", owner: "Kenya escalation owner" }
      on_lapse: { state: "unknown", marker: "?", note: "Not researched.", owner: "Kenya escalation owner" }
  - number: 6
    name: Transfer control
    fields:
