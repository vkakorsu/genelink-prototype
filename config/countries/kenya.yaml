# GENE-LINK country configuration · Kenya
# Transcribed from RFP Appendix B (A5, A6, A7, A9 and the Kenya flow diagram).
# Every regulatory value carries its Appendix B evidence marker:
#   § established · ▸ GENE-LINK's reading · ? unresolved · ⊘ not executable · [GL] GENE-LINK's own construct
# Values marked ? or ▸ are not settled law. A ? that drives a stage halts that stage (R3).

schemaVersion: 1
code: KE
name: Kenya
legalInstruments:
  - Legal Notice 68 of 2025 (Environmental Management and Co-ordination (Access to Biological Resources and Benefit Sharing) (No. 2) Regulations, 2025)
  - Protection of Traditional Knowledge and Cultural Expressions Act 2016
  - Wildlife Conservation and Management Act (definition of wildlife)

operativeInstrumentStatus:
  state: unknown
  marker: "?"
  note: >-
    Whether Legal Notice 68 of 2025 is in force is not established. The National Assembly recorded it
    approved on 29 July 2025 subject to a corrigendum that has not been found. A Senate tracker gives
    15 July 2025 and different wording. LN 19 of 2025 is textually identical on every provision used
    here, so the substance holds even if the instrument number moves. Put it to NEMA before any of
    this drives a build. A drafting defect sits on the face of the instrument: LN 68 reg. 29 misstates
    the title of the instrument it revokes while identifying the correct Legal Notice number (L.N. 19
    of 2025). Appendix B reads it as a footnote that does not by itself invalidate the revocation.
  owner: NEMA question, routed to the Kenya escalation owner
  drives: false

nagoyaParty:
  state: established
  marker: "§"
  value: Party to the Nagoya Protocol
  citation: Appendix B, A2
euSide:
  state: established
  marker: "§"
  value: >-
    NEMA uploads the permit to the ABS Clearing-House, where it becomes the internationally recognised
    certificate of compliance an EU user can rely on. EU due diligence uses the IRCC through its
    reference and the information it carries, not a literal copy.
  citation: reg. 20(2); Regulation (EU) No 511/2014

escalation:
  defaultOwnerRole: GENE-LINK Kenya escalation owner (legal focal point)
  defaultOwnerName: null # pending Landscape Alliance

# ---------------------------------------------------------------------------
# Scope (A5.2): activity test, commercial route only
# ---------------------------------------------------------------------------
scope:
  premise: >-
    This configuration maps the commercial route only. GENE-LINK access is commercial by design. Five
    rules depend on that premise and change if the purpose is not commercial: reg. 11(4)(c), 11(4)(d),
    11(4)(e), the Second Schedule foreign commercial fee, and reg. 12(2) prior informed consent as drawn.
  questions:
    - id: activity
      fact: activity
      prompt: What will be done with the material or the data?
      options:
        - id: collection_research
          label: Collection or research on Kenyan genetic resources
        - id: ex_situ_held
          label: Work on material already held in an ex-situ collection
          hint: Record the geographical place of origin, not the holding institution (reg. 2).
        - id: dsi_only
          label: Sequence data only, nothing physical
    # Kenya's own deciding facts. The interface renders these from the file; it has no Kenya code.
    - id: species_status
      fact: speciesListed
      prompt: Species status on an authoritative list
      default: unchecked
      note: >-
        reg. 11(4)(e) turns on the species status on an authoritative list, not on the applicant's own
        answer. The platform resolves it against the maintained species-status layer before the
        application is accepted; this answer records what that check found.
      options:
        - id: unchecked
          label: Not yet checked
        - id: not_listed
          label: Not endemic, rare or threatened
        - id: listed
          label: Listed (a commercial application must exclude it)
    - id: pgrfa
      fact: pgrfaMaterial
      prompt: Is the material plant genetic resources for food and agriculture (crop varieties, seed) held under the Seeds and Plant Varieties Act or the ITPGRFA?
      default: unclear
      note: >-
        reg. 4(2)(b) excludes access to genetic resources derived from plant breeders under the Seeds and Plant
        Varieties Act (Cap. 326) and the ITPGRFA from these Regulations, and practitioner input (A9) routes such
        material to a KALRO standard material transfer agreement. GENE-LINK has no configured pathway for it, so
        a yes stops at scope and is routed; it is not run through LN 68.
      options:
        - id: "yes"
          label: "Yes, PGRFA under the Seeds and Plant Varieties Act or the ITPGRFA"
        - id: "no"
          label: "No"
        - id: unclear
          label: Not yet established
    - id: localities
      fact: localities
      kind: number
      prompt: Collection localities
      min: 1
      max: 999
      note: >-
        reg. 2 defines a locality by geography, in situ or ex situ, not by the holding institution.
        Whether several localities mean several applications is an open question (A7).
  rules:
    - id: non_commercial_out_of_scope
      when: { purpose: non_commercial }
      result: out_of_scope
      basis:
        state: established
        marker: "§"
        value: >-
          Non-commercial applicants are out of scope and not mapped. reg. 11(2) differs materially from
          reg. 11(4), and the endemic, rare and threatened stop may not apply to them at all. Turning
          away an applicant the law admits is worse than missing a step.
        citation: reg. 11(2); reg. 11(4)
      redirect: Non-commercial route under reg. 11(2), outside GENE-LINK
    - id: pgrfa_not_configured
      when: { pgrfaMaterial: "yes" }
      result: escalate
      basis:
        state: unknown
        marker: "?"
        note: >-
          reg. 4(2)(b) excludes plant-breeder material under the Seeds and Plant Varieties Act and the ITPGRFA
          from LN 68 (Kenya Law consolidated text, retrieved 22 September 2026, pending Landscape Alliance's
          verification round). Practitioner input (A9) routes such material to a KALRO standard material transfer
          agreement, pending NEMA follow-up. Whether GENE-LINK serves PGRFA at all is a product decision.
          Running the material through the LN 68 flow would instruct the parties wrongly, so the case stops here
          and is routed.
        citation: reg. 4(2)(b); Appendix B, A9
        owner: Landscape Alliance for scope; NEMA for routing, through the Kenya escalation owner
        drives: true
    - id: dsi_only_escalate
      when: { activity: dsi_only }
      result: escalate
      basis:
        state: unknown
        marker: "?"
        note: >-
          reg. 4(1)(e) puts digital sequence information expressly in scope, but reg. 11(1) frames every
          application around accessing resources in Kenya and reg. 15(1) issues permits per locality. A
          dataset has no locality. Nothing in the instrument authorises the conclusion that no lawful
          route exists. Treat as unresolved, requiring a regulator ruling, and record the request. The
          Cali Fund is a separate multilateral mechanism and not a substitute for Kenyan law.
        citation: reg. 4(1)(e); reg. 11(1); reg. 15(1)
        owner: NEMA ruling, routed to the Kenya escalation owner
        drives: true
    - id: in_scope
      result: in_scope
      basis:
        state: established
        marker: "§"
        value: >-
          LN 68 sets its scope by access to and utilisation of genetic resources and reaches material
          held ex situ. Prior proof of a function is not an exemption and appears nowhere in the
          instrument. Whether the material was bought is irrelevant.
        citation: LN 68 of 2025, scope provisions

# ---------------------------------------------------------------------------
# Eligibility (A5.1): affiliation conditional on citizenship
# ---------------------------------------------------------------------------
eligibility:
  - id: local_affiliation
    text: A local institutional affiliation is required for non-Kenyans. Kenyan applicants need none.
    when: { applicantType: [foreign_legal, foreign_natural] }
    reg:
      state: established
      marker: "§"
      value: Pair the company with a Kenyan institution. NACOSTI requires a local institutional affiliation for non-Kenyans.
      citation: NACOSTI research licence requirements
  - id: custody_not_entitlement
    text: An institution holding a sample is not by that fact able to consent to its use.
    when: { activity: ex_situ_held }
    reg:
      state: inferred
      marker: "▸"
      value: Custody is not legal entitlement to provide. Establish who may lawfully provide the resource before treating custody as authority. This reading has not been tested against a Kenyan decision.

consentOrder:
  state: established
  marker: "§"
  value: Consent, mutually agreed terms and a benefit-sharing agreement accompany the application itself. reg. 11(4) requires them as application documents.
  citation: reg. 11(4)

# ---------------------------------------------------------------------------
# Stages, in the Kenyan order (A5.3)
# ---------------------------------------------------------------------------
stages:
  - id: intake
    title: GENE-LINK intake
    subject: platform
    trig: A party opens a case with Kenya as provider country
    who: The parties
    needs: [Function needed, evidence of function, candidate species, intended commercial endpoint, what will be done with the material or data]
    gives: A scope answer and a generated pathway
    requirements:
      - id: function_taxonomy
        text: Which function does the company need? Drawn from the 48-code function list.
        reg:
          state: inferred
          marker: "[GL]"
          value: GENE-LINK's own taxonomy. It has no status in Kenyan law and maps to nothing NEMA collects.
  - id: localities
    title: Collection localities
    subject: government
    when: { activity: [collection_research, ex_situ_held] }
    trig: The resource has one or more geographical localities
    who: The applicant
    needs: [Geographical locality of each resource, in situ or ex situ]
    gives: Locality values the application can carry
    requirements:
      - id: locality_definition
        text: A locality is the geographical area where the resource is found, whether in situ or ex situ, not the institution that holds it.
        reg:
          state: established
          marker: "§"
          value: reg. 2 defines locality by geography. The platform needs a location-of-ex-situ-holding field distinct from the institution's name.
          citation: reg. 2
      - id: per_locality_multiplier
        text: Whether several localities require several applications, consent processes, agreements and clocks.
        reg:
          state: unknown
          marker: "?"
          note: >-
            reg. 15(1) issues a permit specific to each locality and the Second Schedule fee table is
            headed fees per locality. Nothing found says five localities require five applications, and
            the application form asks for sites in the plural on one application. Do not encode the
            multiplier as law. Cost modelling built on it is unsafe. Practitioner input (A9) labels the
            NEMA output "Access Permit for 1 year and 1 location", which bears on this question.
          citation: reg. 15(1); Second Schedule
          owner: NEMA question, routed to the Kenya escalation owner
          drives: false
  - id: eligibility
    title: Eligibility checks
    subject: government
    trig: Before anything is spent in the field
    who: The applicant, NACOSTI, WRTI where the resource is wildlife
    needs: [Citizenship of the applicant, species status on an authoritative list, whether the resource is wildlife, whether analysis can run inside Kenya]
    gives: Eligibility to apply
    requirements:
      - id: pgrfa_outstanding
        text: Whether the material is plant genetic resources for food and agriculture under the Seeds and Plant Varieties Act or the ITPGRFA has not been established. reg. 4(2)(b) takes such material out of these Regulations, so eligibility waits on the answer.
        when: { pgrfaMaterial: unclear }
        effect: hold
        reg:
          state: inferred
          marker: "▸"
          value: reg. 4(2)(b) excludes plant-breeder material under the Seeds and Plant Varieties Act and the ITPGRFA from LN 68.
          citation: reg. 4(2)(b)
          note: Establish whether the material is PGRFA under the Seeds and Plant Varieties Act or the ITPGRFA, and answer it on the intake form.
          owner: The case participants, from the material's provenance and holding record
      - id: endemic_rare_threatened_stop
        text: A commercial application must exclude endemic, rare or threatened species. No exemption route appears in the text.
        when: { speciesListed: listed }
        effect: stop
        reg:
          state: established
          marker: "§"
          value: STOP. reg. 11(4)(e) requires a commercial application to exclude endemic, rare or threatened species.
          citation: reg. 11(4)(e)
          note: >-
            The Kenya Law consolidated text (retrieved 22 September 2026) reads "exclude any endemic species, rare
            species or any species protected under any written law or other relevant regulatory framework", which
            is wider than "threatened". Appendix B's wording is kept as the rule; the wider reach is flagged for
            Landscape Alliance's verification round and bears on which lists the species-status layer reads.
      - id: species_status_source
        text: Species status must be resolved against an authoritative list, not the applicant's own answer, before the application is accepted.
        when: { speciesListed: unchecked }
        effect: hold
        reg:
          state: established
          marker: "§"
          value: The platform must resolve species status against a recognised source. The applicant's own answer is not the deciding fact.
          citation: reg. 11(4)(e)
          note: Species status on an authoritative list has not been checked for this case. Resolve it against the maintained species-status layer and record what the check found.
          owner: The species-status check against the maintained list, recorded on the intake form
      - id: wildlife_research_permit
        text: Where the resource falls within the wildlife definition and field research is intended, a WRTI research permit is a legal prerequisite that precedes field work.
        reg:
          state: established
          marker: "§"
          value: The Wildlife Conservation and Management Act definition reaches plants and microorganisms. KWS appears later, on export and CITES, and does not grant research permits.
          citation: Wildlife Conservation and Management Act
      - id: wrti_processing_time
        text: Processing time for the WRTI permit.
        reg:
          state: unknown
          marker: "?"
          note: Figures of 21 working days and a three-month lead circulate but have no current primary source, and they attached to KWS rather than WRTI. Do not quote either.
          owner: WRTI confirmation, routed to the Kenya escalation owner
      - id: cannot_be_done_in_kenya_certifier
        text: Who certifies that the analysis cannot be run inside Kenya.
        reg:
          state: unknown
          marker: "?"
          note: Current NACOSTI requirements do not say NACOSTI issues such a certificate. Older descriptions place the statement on the affiliating institution. Confirm before building a document requirement around it.
          owner: NACOSTI confirmation, routed to the Kenya escalation owner
          drives: false
  - id: tk_statute
    title: Traditional knowledge (separate statute)
    subject: community
    when: { tkInvolved: [yes, unclear] }
    trig: Traditional knowledge is associated with this resource or this use under TK Act s.6
    who: The community, through its own procedures
    needs: [The community's own protocol as an uploaded artefact, consultation on proposed terms, the twelve s.34 terms]
    gives: An authorised-user agreement, filed within 30 days of signature
    requirements:
      - id: tk_criteria
        text: Whether the criteria in TK Act s.6 are met. Not whether documentation of traditional use can be found. s.7 makes protection independent of any formality.
        reg: { state: "established", marker: "§", value: "Undocumented knowledge is protected.", citation: "TK Act ss.6, 7" }
      - id: two_authorisations
        text: An authorisation to use traditional knowledge is not an authorisation to access the genetic resource, and the reverse holds too.
        reg: { state: "established", marker: "§", value: "The section separates the two authorisations.", citation: "TK Act s.26" }
      - id: publication_not_an_exit
        text: Publication does not end protection, but protection is not absolute either. It holds while the s.6 criteria are met, and s.19 carries exceptions for teaching, research, criticism and review and certain non-commercial uses. Test the criteria and the intended use. Do not test whether someone published.
        reg: { state: "established", marker: "§", value: "Protection turns on the s.6 criteria and the intended use, not on prior publication.", citation: "TK Act ss.6, 19" }
      - id: own_procedures
        text: Each community adopts its own procedures. One national community-meeting workflow cannot be hard-coded. Where the protocol cannot be established, escalate.
        reg: { state: "established", marker: "§", value: "The community's protocol is data the platform collects, not a template it supplies.", citation: "TK Act s.10(3)" }
      - id: consult_then_negotiate
        text: Consult the community on the proposed terms before any agreement is signed. Owners may accept and enter negotiations within the specified 60-day period. The section does not require negotiations to conclude within 60 days.
        reg: { state: "established", marker: "§", value: "The 60-day window is for entering negotiations, not for concluding them. A clock on conclusion would be a misreading.", citation: "TK Act ss.32, 33" }
      - id: twelve_terms
        text: The authorised-user agreement must contain all twelve listed terms, among them royalties, exclusivity, intellectual property sharing, publication control and moral rights.
        reg: { state: "established", marker: "§", value: "Twelve mandatory terms. A template that omits one produces an agreement the Act does not recognise.", citation: "TK Act s.34" }
      - id: filing_sequence
        text: Before signing, inform the Cabinet Secretary and supply the proposed agreement for comment. After signing, file the executed agreement within 30 days. A user may also obtain consent directly from the holders without first applying to the Cabinet Secretary; the filing duties still run.
        reg: { state: "established", marker: "§", value: "s.36 filing sequence runs around the signature, and the direct-from-holders consent route does not remove the filing duties.", citation: "TK Act s.36" }
      - id: register_architecture
        text: Registration is not one register. Counties keep traditional-knowledge registers (ss.7(2), 8(1)) and a national TK Digital Repository exists under s.8(3); the s.36 filing duties to the Cabinet Secretary run alongside them, not instead.
        reg: { state: "established", marker: "§", value: "Dual register architecture: county registers and the national repository coexist with the Cabinet Secretary filing duties.", citation: "TK Act ss.7(2), 8(1), 8(3), 36" }
      - id: registration_procedure
        text: Agreements not registered by the Cabinet Secretary are null and void, but no implementing regulations were located.
        reg:
          state: unknown
          marker: "?"
          note: No implementing regulations were located on Kenya Law as of 13 Aug 2026 under s.43, s.12(4) or s.33(2). The registration on which s.35(2) validity depends has no published procedure.
          citation: TK Act s.35(2)
          owner: Cabinet Secretary procedure, routed to the Kenya escalation owner
          drives: true
    consentParties:
      - id: tk_holder
        label: Traditional knowledge holder community
        reg: { state: "established", marker: "§", value: "Adds a consent party. Does not decide whether consent is needed.", citation: "TK Act s.6" }
  - id: consent_and_terms
    title: Consent and terms
    subject: community
    trig: A commercial application over a community's resource
    who: The resource-providing community, then applicant and provider
    needs: [Prior informed consent in accordance with customary laws, practices, protocols and procedures, mutually agreed terms on the Fifth Schedule model form]
    gives: Consent, MAT and a benefit-sharing agreement capable of supporting the application
    consentParties:
      - id: resource_providers
        label: Relevant biological resource providers (interested persons and relevant stakeholders), as NEMA guides
        reg:
          state: inferred
          marker: "▸"
          value: >-
            A commercial application carries evidence of prior informed consent and mutually agreed terms "from
            interested persons and relevant stakeholders where applicable" (reg. 11(4)(b)), and the Competent
            National Authority "shall guide the applicant on the relevant biological resource providers from whom
            Prior Informed Consent is to be obtained" (reg. 12(1)). Consent is therefore not only a community
            question: a landholder, a resource manager or an ex-situ provider may be the consenting party.
          citation: reg. 11(4)(b); reg. 12(1)
          note: Retrieved from the Kenya Law consolidated text on 22 September 2026. Not drawn in the Appendix B diagram, which shows community consent only. Pending Landscape Alliance's verification round.
      - id: community
        label: Resource-providing community
        when: { communityHeld: [yes, unclear] }
        reg: { state: "established", marker: "§", value: "Prior informed consent obtained in accordance with the customary laws of the community. No meeting format, quorum or threshold is prescribed.", citation: "reg. 12(2)" }
    requirements:
      - id: mat_model_form
        text: Terms agreed between applicant and provider become the Mutually Agreed Terms, on the Fifth Schedule model form.
        reg: { state: "established", marker: "§", value: "reg. 12(3) and 12(4).", citation: "reg. 12(3), 12(4)" }
      - id: fifth_schedule_rates
        text: Fifth Schedule opening terms, 50:50 venture ownership conditional on commercialisation, 15% royalty on copyrights, minimum 10% on others.
        reg: { state: "established", marker: "§", value: "The numbers are real.", citation: "Fifth Schedule Arts. 8.4, 8.5" }
      - id: rates_negotiable
        text: Whether the Fifth Schedule terms are negotiable.
        reg:
          state: unknown
          marker: "?"
          note: The numbers are real. Their status is not. Software must not treat them as editable defaults, and must not treat them as immutable rates.
          citation: Fifth Schedule Art. 8.4
          owner: NEMA question, routed to the Kenya escalation owner
          drives: true
    documents:
      - id: pic_providers
        label: Evidence of prior informed consent and mutually agreed terms from the relevant resource providers (Fourth Schedule PIC form), where applicable
        reg: { state: "inferred", marker: "▸", value: "reg. 11(4)(b) with reg. 12(1): NEMA guides the applicant on whom consent must come from.", citation: "reg. 11(4)(b); reg. 12(1)", note: "Retrieved from the Kenya Law consolidated text on 22 September 2026. Pending Landscape Alliance's verification round." }
      - id: pic
        label: Prior informed consent (Fourth Schedule form, obtained under the community's own procedure)
        when: { communityHeld: [yes, unclear] }
        reg: { state: "established", marker: "§", value: "reg. 12(2).", citation: "reg. 12(2)" }
      - id: mat
        label: Mutually agreed terms (Fifth Schedule model form)
        reg: { state: "established", marker: "§", value: "reg. 12(4).", citation: "reg. 12(4)" }
      - id: bsa
        label: Benefit-sharing agreement, included with the application
        reg: { state: "established", marker: "§", value: "The text says include. It does not say signed.", citation: "reg. 11(4)(c)" }
      - id: mta_application
        label: Material transfer agreement (application document, unqualified on the commercial route)
        reg: { state: "established", marker: "§", value: "Required with no qualification even where nothing leaves Kenya. It is not itself a transfer and does not authorise one. The non-commercial reg. 11(2)(d) qualifies it with 'where applicable'; the commercial route does not.", citation: "reg. 11(4)(d); reg. 11(2)(d)" }
  - id: submission
    title: Submission and determination
    subject: government
    usesStateMachine: true
    trig: Consent, terms and NACOSTI prerequisites in place
    who: NEMA for the access permit, NACOSTI for the research licence
    needs: [The reg. 11(4) documents, ethical approval, the fee]
    gives: A pending application, then two instruments from two issuers
    produces: [nema_access_permit, nacosti_research_licence]
    requirements:
      - id: nacosti_prerequisites
        text: Ethical approval and, for genetic resources, PIC, MAT and MTA must exist before the NACOSTI submission, not alongside it.
        reg: { state: "established", marker: "§", value: "NACOSTI prerequisites.", citation: "NACOSTI requirements" }
      - id: nema_fee
        text: NEMA access permit fee for a foreign commercial applicant.
        when: { applicantType: [foreign_legal, foreign_natural] }
        reg: { state: "established", marker: "§", value: "KSh 1,000,000 per locality. The commercial fee table draws no corporate or individual distinction.", citation: "Second Schedule" }
      - id: nacosti_fee
        text: NACOSTI research licence fee.
        reg:
          state: unknown
          marker: "?"
          note: NACOSTI's published schedule caps the Non-Africa column at US$500 for individual and post-doctoral applicants and shows KES 20,000 for private institutions with a dash in every foreign column. A 2024 NACOSTI news post quotes US$10,000. Confirm the current schedule before quoting a figure. The one-year licence duration is established.
          owner: NACOSTI schedule confirmation, routed to the Kenya escalation owner
          drives: false
      - id: sectoral_clearance
        text: Practitioner input reports a sectoral clearance layer before or alongside NEMA and NACOSTI, routed by category of material (KWS/KFS/KeFS, KEPHIS, DVS, MoH, NMK), and a separate ITPGRFA track through a KALRO SMTA. Separately, the regulation's own text excludes plant-breeder material under the Seeds and Plant Varieties Act and the ITPGRFA from LN 68 altogether.
        reg:
          state: inferred
          marker: "▸"
          value: >-
            Two statements of different provenance, both GENE-LINK's reading for now. The exclusion is on the
            face of the instrument: reg. 4(2)(b), retrieved from the Kenya Law consolidated text on 22
            September 2026, says these Regulations shall not apply to access to genetic resources derived from
            plant breeders in accordance with the Seeds and Plant Varieties Act (Cap. 326) and the ITPGRFA;
            it awaits Landscape Alliance's verification round. The routing of such material to a KALRO
            standard material transfer agreement, and the sectoral clearance layer, are practitioner-sourced
            working knowledge (A9) awaiting NEMA follow-up. Neither is folded into the established entries.
            The intake asks whether the material is PGRFA: a yes stops at scope and is routed, because
            whether GENE-LINK serves PGRFA at all is an open question on this file.
          citation: reg. 4(2)(b); Appendix B, A9
  - id: export
    title: Export chain
    subject: government
    when: { exchange: [title_transfer, service_shipment] }
    trig: Something physically leaves Kenya
    who: NEMA, KWS where wildlife, KEPHIS where the importing country requires it
    needs: [Sixth Schedule material transfer agreement filed with NEMA, declaration at the port of departure]
    gives: Lawful export, on top of the permit
    requirements:
      - id: sixth_schedule
        text: Material transfer agreement on the Sixth Schedule form, filed with NEMA.
        reg: { state: "established", marker: "§", value: "reg. 21(1) and 21(3).", citation: "reg. 21(1), 21(3)" }
      - id: holotype
        text: A holotype must remain in Kenya. How this applies to extracts, microbial isolates and other non-taxonomic material is an open design question.
        reg: { state: "established", marker: "§", value: "reg. 21(5).", citation: "reg. 21(5)" }
      - id: border_declaration
        text: Declare the material at the port of departure and produce the material transfer agreement.
        reg: { state: "established", marker: "§", value: "reg. 21(4).", citation: "reg. 21(4)" }
      - id: kws_export
        text: Where the material is wildlife, a KWS export permit. KWS handles export and CITES; it does not grant the research permit, which is WRTI's, earlier in this pathway.
        reg: { state: "established", marker: "§", value: "KWS export permit for wildlife. The wildlife definition reaches plants and microorganisms.", citation: "Wildlife Conservation and Management Act" }
      - id: phytosanitary
        text: KEPHIS phytosanitary certificate is conditional on the importing country's requirements for that material. Not a generic Kenyan export clearance.
        reg: { state: "established", marker: "§", value: "Two machine-testable conditions: does the destination country require it for this material, and is the species CITES-listed, requiring a CITES permit as well.", citation: "KEPHIS procedure" }
      - id: tk_articles_export
        text: Unauthorised export of an article related to traditional knowledge for non-traditional use is an offence whether or not the use is commercial.
        when: { tkInvolved: [yes, unclear] }
        reg: { state: "established", marker: "§", value: "s.37(9) closes the s.37(1) carve-out for TK-related articles.", citation: "TK Act s.37(9)" }
  - id: continuity
    title: What attaches to the permit (phase two)
    subject: platform
    informational: true
    trig: Instruments issued
    who: The permit holder, NEMA, the Cabinet Secretary
    needs: []
    gives: Duties recorded on the instrument, not run by the MVP
    requirements:
      - id: journey_does_not_end
        text: The continuing duties live in the country configuration table (obligation classes), not in the pathway.
        reg: { state: "inferred", marker: "▸", value: "reg. 18(2) standing conditions, biannual and annual reporting, disclosure of discoveries, the s.11 attribution duty and the TK Act notification duties." }

# ---------------------------------------------------------------------------
# Regulator processing (A5.5, R8, R9)
# ---------------------------------------------------------------------------
stateMachine:
  initial: preparing
  states:
    preparing: { label: Preparing application bundle, kind: active }
    submitted: { label: Submitted to NEMA and NACOSTI, kind: waiting }
    under_review:
      label: Under review (30 working days from receipt)
      kind: waiting
      reg: { state: "established", marker: "§", value: "The Authority processes the application within 30 working days from receipt and communicates its decision in writing within the same period. The period is suspended while the application is incomplete or an issue raised by the Authority is outstanding.", citation: "reg. 14(1), 14(3), 16" }
    public_notice:
      label: Public notice and comment
      kind: waiting
      reg: { state: "established", marker: "§", value: "The regulations contemplate publication and comments before determination. Publication is at the Authority's discretion ('may') and at the applicant's cost, so determination can also follow review directly.", citation: "reg. 13; reg. 15(1)" }
    information_requested: { label: Further information required, kind: active }
    resubmitted: { label: Resubmitted, kind: waiting }
    granted:
      label: Granted. Permit uploaded to the ABS Clearing-House
      kind: terminal
      outcome: granted
      reg: { state: "established", marker: "§", value: "NEMA uploads the permit to the ABS Clearing-House where it becomes the IRCC.", citation: "reg. 20(2)" }
    refused:
      label: Refused. Statutory appeal path applies
      kind: terminal
      outcome: refused
      reg: { state: "established", marker: "§", value: "Reasons for a refusal are given in writing, and a person aggrieved may appeal to the Tribunal. Model refusal and appeal as states. A system that only represents granted cannot carry a real caseload.", citation: "reg. 15(2), 15(3)" }
    appealed: { label: Appealed, kind: waiting }
    withdrawn: { label: Withdrawn by applicant, kind: terminal, outcome: withdrawn }
    varied:
      label: Varied by the Authority
      kind: active
      reg: { state: "established", marker: "§", value: "reg. 18(3) gives the Authority a general power to vary a permit. It is not a route around reg. 11(6).", citation: "reg. 18(3)" }
    deadline_lapsed:
      label: Statutory deadline lapsed. Remedy against the administrator, no permit
      kind: halted
      outcome: lapsed
  transitions:
    - { from: preparing, to: submitted, event: submit, actor: applicant }
    - { from: submitted, to: under_review, event: acknowledge, actor: authority }
    - { from: under_review, to: public_notice, event: publish, actor: authority }
    - { from: under_review, to: information_requested, event: request_information, actor: authority }
    - { from: public_notice, to: information_requested, event: request_information, actor: authority }
    - { from: information_requested, to: resubmitted, event: resubmit, actor: applicant }
    - { from: resubmitted, to: under_review, event: acknowledge, actor: authority }
    - { from: public_notice, to: granted, event: grant, actor: authority }
    - { from: under_review, to: granted, event: grant, actor: authority }
    - { from: public_notice, to: refused, event: refuse, actor: authority }
    - { from: under_review, to: refused, event: refuse, actor: authority }
    - { from: refused, to: appealed, event: appeal, actor: applicant }
    - { from: appealed, to: granted, event: uphold_appeal, actor: authority }
    - { from: appealed, to: refused, event: dismiss_appeal, actor: authority }
    - { from: granted, to: varied, event: vary, actor: authority }
    - { from: varied, to: granted, event: variation_recorded, actor: system }
    - { from: preparing, to: withdrawn, event: withdraw, actor: applicant }
    - { from: submitted, to: withdrawn, event: withdraw, actor: applicant }
    - { from: under_review, to: withdrawn, event: withdraw, actor: applicant }
    - { from: information_requested, to: withdrawn, event: withdraw, actor: applicant }
    - { from: public_notice, to: withdrawn, event: withdraw, actor: applicant, reg: { state: "inferred", marker: "▸", value: "An applicant may withdraw an application at any point before the decision. General administrative law; Appendix B does not address it." } }
    - { from: resubmitted, to: withdrawn, event: withdraw, actor: applicant, reg: { state: "inferred", marker: "▸", value: "An applicant may withdraw an application at any point before the decision. General administrative law; Appendix B does not address it." } }
    - { from: under_review, to: deadline_lapsed, event: lapse, actor: system }
    - { from: public_notice, to: deadline_lapsed, event: lapse, actor: system }
    - { from: deadline_lapsed, to: under_review, event: administrator_resumes, actor: authority }
  clocks:
    - id: determination
      label: Determination clock (reg. 14(1) and 16, 30 working days from receipt; suspended while incomplete or an issue is outstanding, reg. 14(3))
      startsIn: under_review
      # Publication and comment (reg. 13) sit inside the 30 working days, not after them.
      runsIn: [under_review, public_notice]
      days: 30
      dayKind: working
      # Suspended from the Authority's request until the Authority has the completed application again.
      suspendsIn: [information_requested, resubmitted]
      onLapse:
        to: deadline_lapsed
        effect: remedy_against_administrator
        reg:
          state: established
          marker: "§"
          value: In every regime a missed statutory deadline gives the applicant a remedy against the administrator. It does not grant the permit.
          citation: Appendix B, A5.5 and R8

# Working days skip the weekend and Kenya's public holidays. Dates that turn on a moon sighting are
# gazetted each year by the Cabinet Secretary for the Interior and are carried as provisional until then.
calendar:
  weekend: [6, 7]
  coversThrough: "2027-12-31"
  reg:
    state: inferred
    marker: "▸"
    value: >-
      Holidays are those of the Public Holidays Act (Cap. 110), with a holiday falling on a Sunday observed on
      the Monday. LN 68 does not define a working day; treating Saturday and Sunday as non-working is
