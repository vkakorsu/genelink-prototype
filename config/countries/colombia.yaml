      monitoring_duty: { state: "established", marker: "§", value: "Art. 43 places monitoring duties on the national support institution. The INA is not only a filing formality.", citation: "D391 Art. 43" }
      submitted_to: { state: "established", marker: "§", value: "MADS, with the INA in the monitoring role" }
