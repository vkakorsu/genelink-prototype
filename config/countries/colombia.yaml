openQuestions:
  - id: consultation_document
    question: Which consultation document is currently required
    affects: A required upload. The regulation and the live checklist name one document, other guidance names another.
    reg: { state: "unknown", marker: "?", citation: "D.1076 §2.2.2.8.3.2; ANLA VITAL", owner: "Colombia escalation owner", drives: true }
  - id: certificate_counts
    question: Published certificate counts
    affects: Claims about EU documentation burden. The count failed re-check and needs a live query with a retrieval date, or removal.
    reg: { state: "unknown", marker: "?", note: "An earlier reading gave 6,542 certificates worldwide and zero for Colombia. The non-Party status is independently verified and the conclusion stands without the number.", owner: "Colombia escalation owner" }
  - id: eu_reach_non_party
    question: The reach of EU due diligence over non-Party material
    affects: Whether material from a non-Party State falls inside Regulation (EU) No 511/2014 at all. The answer changes the documentation burden in either direction.
    reg: { state: "unknown", marker: "?", note: "A legal opinion is being sought. Evidence to weigh: Art. 2(4) of the Regulation confines it to genetic resources governed by the ABS legislation of a Party, and Commission guidance 2021/C 13/01 §2.1.6 states that utilisation of genetic resources from non-Parties is outside the Regulation's scope. Guidance is not law, and it does not displace Colombian law.", citation: "Regulation (EU) No 511/2014 Art. 2(4); Commission guidance 2021/C 13/01 §2.1.6", owner: "Landscape Alliance legal opinion" }
  - id: dsi_route
    question: Whether digital sequence information alone is inside the access regime
    affects: The sequence-data-only route
    reg: { state: "unknown", marker: "?", note: "An exhaustive negative. Route to legal review.", owner: "Colombia escalation owner", drives: true }

