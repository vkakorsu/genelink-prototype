# GENE-LINK country configuration · Colombia
# Transcribed from RFP Appendix B (A2, A5, A6, A7 and the Colombia flow diagram).
#   § established · ▸ GENE-LINK's reading · ? unresolved · ⊘ not executable · [GL] GENE-LINK's own construct

schemaVersion: 1
code: CO
name: Colombia
legalInstruments:
  - Decisión Andina 391
  - Decreto 1076/2015
  - Resoluciones 1348/2014 and 1352/2017
  - Decisión 486/2000 (Andean IP regime)

operativeInstrumentStatus:
  state: established
  marker: "§"
  value: Decisión Andina 391 and Decreto 1076/2015 are operative. Res. 1352/2017 deleted the patent trigger from Res. 1348 Art. 2.
  citation: Res. 1352/2017

nagoyaParty:
  state: established
  marker: "§"
  value: >-
    Colombia is not a Party to the Nagoya Protocol. Signed 2 Feb 2011, ratification blank in the UN Treaty
    Collection, ABS Clearing-House returns party null. Colombia is a Party to the Nagoya-Kuala Lumpur
    Supplementary Protocol, a biosafety instrument. Do not treat the second as satisfying the first.
  citation: UN Treaty Collection; ABS Clearing-House
euSide:
  state: unknown
  marker: "?"
  note: >-
    No internationally recognised certificate of compliance can issue for Colombian material, because
    Colombia is not a Party. What follows for an EU user is the open question, and two readings are on
    the table. Appendix B's reading: Regulation (EU) No 511/2014 Art. 4(3)(b) and Implementing Regulation
    (EU) 2015/1866 accept other relevant information and documents where no certificate exists, so
    Colombian material carries a heavier and less standardised documentation burden. The Commission's
    reading: Art. 2(4) confines the Regulation to genetic resources governed by the ABS legislation of a
    Party to the Nagoya Protocol, and the Commission's guidance 2021/C 13/01, section 2.1.6, states that
    utilisation of genetic resources from non-Parties is outside the scope of the EU ABS Regulation, while
    users should still comply with the provider country's law and any mutually agreed terms. The two
    readings give an EU user opposite answers on whether an Art. 7 due-diligence declaration is owed at
    all. Colombian law binds regardless. The platform presents neither reading as settled. A legal opinion
    is being sought by GENE-LINK.
  citation: Regulation (EU) No 511/2014 Arts. 2(4), 4(3)(b), 7; Commission guidance 2021/C 13/01 §2.1.6; Appendix B, A7 cross-cutting
  owner: Landscape Alliance legal opinion, routed to the Colombia escalation owner
  drives: false

escalation:
  defaultOwnerRole: GENE-LINK Colombia escalation owner (legal focal point)
  defaultOwnerName: null # pending Landscape Alliance

scope:
  premise: >-
    This configuration maps the commercial route only. In Colombia that removes an entire procedure: the
    collection permit under Decreto 1376/2013 (compiled into Decreto 1076) governs collection for scientific
    research with non-commercial purposes and is not available here. A purpose gate must precede any
    collection track.
  questions:
    - id: activity
      fact: activity
      prompt: Does the planned activity configure access under Res. 1348/2014 Art. 2?
      options:
        - id: listed_activity
          label: A listed activity on the stated methodology (separating DNA or RNA units, isolating metabolic molecules, and the other listed activities)
        - id: no_listed_activity
          label: No listed activity on the stated methodology
          hint: Record the methodology the conclusion rests on. A change of method can bring the activity back in.
        - id: dsi_only
          label: Sequence data only, nothing physical
    # Colombia's own deciding fact. The interface renders it from the file; it has no Colombia code.
    - id: direct_affectation
      fact: directAffectation
      prompt: Direct affectation (afectación directa) of an ethnic community?
      default: unclear
      note: >-
        Decides whether prior consultation precedes the application. Per SU-123/2018 a titled resguardo
        is strong evidence but not the trigger, and geography alone does not suffice. Unclear keeps the
        consultation stage on the pathway; answering no removes it and is itself recorded.
      options:
        - id: "yes"
          label: "Yes"
        - id: "no"
          label: "No"
        - id: unclear
          label: Unclear
    - id: country_of_origin
      fact: colombiaOrigin
      prompt: Is Colombia the country of origin of the genetic resource (D391 Art. 6)?
      default: unclear
      note: >-
        Art. 6 makes genetic resources and derived products patrimony of the Nation of the Member Country that
        is their country of origin, de conformidad con legislaciones internas. The condition is routinely
        dropped when the article is quoted, and it can change the result. Holding material in Colombia does not
        by itself make Colombia the country of origin.
      options:
        - id: "yes"
          label: "Yes"
        - id: "no"
          label: "No, another country is the country of origin"
        - id: unclear
          label: Not yet established
  rules:
    - id: non_commercial_out_of_scope
      when: { purpose: non_commercial }
      result: out_of_scope
      basis:
        state: established
        marker: "§"
        value: The non-commercial collection track is out of scope and not mapped. ANLA imposes additional supporting documents on foreign applicants, collection inside the National Natural Parks System routes to Parques Nacionales Naturales, and the track carries its own post-grant obligations.
        citation: Decreto 1076/2015 (compiling Decreto 1376/2013)
      redirect: Non-commercial collection permit track (ANLA), outside GENE-LINK
    - id: dsi_only_escalate
      when: { activity: dsi_only }
      result: escalate
      basis:
        state: unknown
        marker: "?"
        note: >-
          Sequence data alone is an open question, not an exit. No domestic instrument was found that
          follows digital sequence information as such, but that is an exhaustive negative, and absence of
          a found rule is not a rule of absence. Route to legal review as an unresolved state. Do not label
          it outside the access regime.
        owner: Legal review, routed to the Colombia escalation owner
        drives: true
    - id: no_listed_activity_out
      when: { activity: no_listed_activity }
      result: out_of_scope
      basis:
        state: established
        marker: "§"
        value: Outside the access regime on the Art. 2 test. Record the methodology the conclusion rests on. Crude extracts are inside the definition of producto derivado (D391 Art. 1) but the definition is not the trigger. The Art. 2 activity test and the planned methodology decide.
        citation: Res. 1348/2014 Art. 2; D391 Art. 1
      redirect: Outside the access regime. Recorded basis kept on the case.
    - id: not_country_of_origin
      when: { colombiaOrigin: "no" }
      result: out_of_scope
      basis:
        state: established
        marker: "§"
        value: The Art. 6 patrimony claim does not attach on these facts. Establish which country of origin does, and whether its regime applies instead.
        citation: D391 Art. 6
      redirect: The country of origin's own access regime. GENE-LINK runs it where that country is configured.
    - id: in_scope
      result: in_scope
      basis:
        state: established
        marker: "§"
        value: >-
          Res. 1348/2014 Art. 2 defines access through activities. Whether the material was bought, and
          whether its function was demonstrated before, tells you nothing about whether the downstream
          activity configures access. D391 Art. 6 applies where Colombia is the country of origin, a
          condition routinely dropped when the article is quoted. Crude extracts are inside the
          producto derivado definition (D391 Art. 1), but the definition is not the trigger: there is
          no crude-extract off-ramp and no automatic contract either; the Art. 2 activity test decides.
        citation: Res. 1348/2014 Art. 2; D391 Arts. 1, 6

eligibility:
  - id: national_support_institution
    text: The application names a national support institution, la persona o institución nacional de apoyo, a person or an institution.
    reg:
      state: established
      marker: "§"
      value: MADS defines the INA as a Colombian legal person conducting research and assisting both applicant and Ministry. Do not hard-code "pair with a Colombian lab". The role is broader.
      citation: D391 Art. 26(c); MADS operating procedure
  - id: individual_or_framework
    text: Individual or framework contract? Decided by the applicant and project structure (universities, research centres, recognised researchers, and whether several projects are contemplated), not by a commercial versus non-commercial divide. The contrato individual is the single-project route. The contrato marco is the framework route, and nothing in Art. 36 restricts it to non-commercial use.
    reg:
      state: established
      marker: "§"
      value: Nothing in Art. 36 restricts the contrato marco to non-commercial use. MADS Contrato Marco No. 405 with SINCHI (2025) covers a bioprospecting programme and runs 20 years.
      citation: D391 Art. 36

consentOrder:
  state: established
  marker: "§"
  value: Prior consultation, where direct affectation arises, precedes the application. The contract itself is negotiated after acceptance, not before.
  citation: A5.3; DP 08/2020; D391 Arts. 29 to 32

stages:
  - id: intake
    title: GENE-LINK intake
    subject: platform
    trig: A party opens a case with Colombia as provider country
    who: The parties
    needs: [Function needed, evidence of function, candidate species, intended commercial endpoint, planned methodology]
    gives: A scope answer on the Art. 2 activity test and a generated pathway
    requirements:
      - id: function_taxonomy
        text: Which function does the company need? Drawn from the 48-code function list.
        reg: { state: "inferred", marker: "[GL]", value: "GENE-LINK's own taxonomy. It has no status in Colombian law and maps to nothing MADS collects." }
  - id: prior_consultation
    title: Prior consultation (consulta previa)
    subject: community
    when: { directAffectation: [yes, unclear] }
    trig: Direct affectation (afectación directa) arises, per SU-123/2018, which rejects formal territorial boundaries as the whole inquiry
    who: The applicant, the community, the DANCP
    needs: [Preconsulta, consultation, protocolización record]
    gives: The consultation record the application must carry
    requirements:
      - id: direct_affectation_test
        text: A titled resguardo is strong evidence. It is not the trigger, and geography alone does not suffice.
        reg: { state: "established", marker: "§", value: "Consulta previa runs under DP 08/2020 through the DANCP process.", citation: "SU-123/2018; DP 08/2020" }
      - id: consultation_document
        text: Which consultation document is currently required.
        reg:
          state: unknown
          marker: "?"
          note: >-
            The required document is in version conflict. D.1076 §2.2.2.8.3.2 still specifies the Ministry
            document and the protocolización record, and the current ANLA VITAL checklist still asks for the
            certificate plus the protocolización act. Other guidance uses pronunciamiento language. Model as
            "currently required document, validate against the live checklist", not as old replaced by new.
          citation: D.1076 §2.2.2.8.3.2; ANLA VITAL checklist
          owner: Live checklist validation, routed to the Colombia escalation owner
          drives: true
    consentParties:
      - id: affected_community
        label: Directly affected community
        reg: { state: "established", marker: "§", value: "Consultation is required where direct affectation arises.", citation: "SU-123/2018" }
    documents:
      - id: protocolizacion
        label: Consultation record (currently required document, validated against the live checklist)
        reg: { state: "unknown", marker: "?", note: "Which document this is remains the open question above. Validate against the live ANLA VITAL checklist before uploading.", owner: "Colombia escalation owner" }
  - id: intangible_component
    title: Intangible component (associated traditional knowledge)
    subject: community
    when: { tkInvolved: [yes, unclear] }
    trig: The project uses associated traditional knowledge itself
    who: The applicant and the knowledge holders
    needs: [The intangible-component annex to the access contract]
    gives: The Art. 35 annex providing for fair and equitable distribution of benefits from that knowledge
    requirements:
      - id: different_question
        text: A different question from direct affectation. Consultation does not imply the annex, and the annex does not imply consultation.
        reg: { state: "established", marker: "§", value: "Art. 35 intangible-component annex.", citation: "D391 Art. 35" }
      - id: annex_breach
        text: Breach of the annex is a causal de resolución y nulidad, a ground requiring a determination, not an automatic transition to a void state.
        reg: { state: "established", marker: "§", value: "A causal de resolución y nulidad: a ground that requires a determination by the authority. Not an automatic void state.", citation: "D391 Art. 35" }
    consentParties:
      - id: tk_holders
        label: Holders of the associated traditional knowledge
        reg: { state: "established", marker: "§", value: "Adds a party to the annex. Does not decide whether consultation is needed.", citation: "D391 Art. 35" }
  - id: application_data
    title: Application data (Art. 26)
    subject: applicant
    trig: Intention to apply
    who: The applicant
    needs: [Applicant identity, the provider, the national support institution, the project team, the access activity, the location, the project]
    gives: A filable application
    requirements:
      - id: country_of_origin_outstanding
        text: Whether Colombia is the country of origin has not been established. The application rests on the Art. 6 claim, so it waits on that fact.
        when: { colombiaOrigin: unclear }
        effect: hold
        reg:
          state: established
          marker: "§"
          value: Art. 6 applies where Colombia is the country of origin. The condition decides whether this pathway applies at all.
          citation: D391 Art. 6
          note: Establish whether Colombia is the country of origin of the resource, from its provenance record, and answer it on the intake form.
          owner: The case participants, from the resource's provenance record
      - id: which_authority
        text: Which environmental authority? The location of the activity and how many jurisdictions it spans. ANLA, a regional CAR, a sustainable-development corporation, a large urban authority, or Parques Nacionales Naturales inside the National Natural Parks System.
        reg: { state: "established", marker: "§", value: "The model is not simply ANLA or a CAR.", citation: "D391 Art. 26; Art. 31" }
    documents:
      - id: ina_designation
        label: National support institution designation
        reg: { state: "established", marker: "§", value: "Art. 26(c).", citation: "D391 Art. 26(c)" }
      - id: project_document
        label: Project description, team, activity, location
        reg: { state: "established", marker: "§", value: "Art. 26.", citation: "D391 Art. 26" }
  - id: access_proceeding
    title: The access proceeding
    subject: government
    usesStateMachine: true
    trig: A filable application
    who: MADS, with parallel environmental procedures running independently and feeding the evaluation
    needs: [Admission on completeness, publication in two media within five business days, evaluation]
    gives: Acceptance or denial by reasoned resolution
    requirements:
      - id: publication_two_media
        text: Publication of an extract within five working days of registration, in two media, one written medium of wide national circulation and one of the locality where access will take place. Store the date and the evidence per publication. A single published flag loses half the duty.
        reg: { state: "established", marker: "§", value: "Art. 28: dentro de los cinco días hábiles siguientes a la fecha de inscripción de la solicitud en el registro público.", citation: "D391 Art. 28" }
      - id: evaluation_clock
        text: 30 working days from registration for evaluation, extendable by up to 60 more working days at the authority's discretion, roughly 90 in total. Five working days to notify an acceptance. The five-day deadline attaches to notifying, not deciding.
        reg: { state: "established", marker: "§", value: "Art. 29: dentro de los treinta días hábiles siguientes al registro ... prorrogable hasta por sesenta días hábiles, a juicio de la Autoridad Nacional Competente. Art. 30: notificada al solicitante dentro de los cinco días hábiles siguientes.", citation: "D391 Arts. 29, 30" }
      - id: parallel_procedures
        text: Where other environmental procedures apply, they run independently and their results feed this evaluation. They are not alternatives to it.
        reg: { state: "established", marker: "§", value: "Art. 31.", citation: "D391 Art. 31" }
      - id: actual_duration
        text: How long it actually takes. MADS estimates roughly 120 business days and states the procedure is free of charge.
        reg:
          state: inferred
          marker: "[GL]"
          value: GENE-LINK's own analysis of the Minambiente open dataset, 347 files, gives a median of 237 calendar days from auto de inicio to signature, P75 410, maximum 3,125. Ours, not a government metric. Dataset stale since May 2023.
  - id: contract_negotiation
    title: Contract negotiation
    subject: money
    trig: An accepted application
    who: MADS and the applicant
    needs: [The draft contract, a meeting, negotiation of terms]
    gives: A contract ready for signature. Acceptance is not a contract.
    produces: [access_contract]
    requirements:
      - id: acceptance_not_contract
        text: Any model that jumps from accepted to signed loses the step where the obligations are actually set.
        reg: { state: "established", marker: "§", value: "Contract negotiation is the state where benefit sharing becomes system data." }
      - id: state_is_counterparty
        text: The access contract is between the State and the applicant. It is one instrument with one counterparty, which is why a later modification is an addendum to it and not a second contract.
        reg: { state: "established", marker: "§", value: "The State is the counterparty. Accessory contracts with third parties hang off it and do not replace it.", citation: "D391 Art. 32" }
      - id: accessory_contracts
        text: Is an accessory contract needed? Whether a third party supplies land, the biological resource, ex-situ material or national support. The counterparty may be the owner, the possessor or the administrator, three roles, not one landholder. Ex-situ centres and other entities that carry out access activities are caught by the activity, not by their institutional form.
        reg: { state: "established", marker: "§", value: "Accessory contracts carry a suspensive condition and take effect only on the access contract taking effect. Nullity cascades one way only: nullity of the access contract entails nullity of the accessory; in the other direction the authority may terminate, at its discretion, where an indispensable accessory contract fails. The Art. 37 trigger is the activity, not the institution.", citation: "D391 Arts. 37, 41, 42, 44" }
      - id: perfected_on_publication
        text: The contract is perfected on publication. The public register is declaratory.
        reg: { state: "established", marker: "§", value: "Arts. 38 and 21.", citation: "D391 Arts. 38, 21" }
  - id: export
    title: Export and transfer
    subject: government
    when: { exchange: [title_transfer, service_shipment] }
    trig: Material leaves Colombia
    who: CITES authority where listed, ANLA for non-CITES specimens, ICA and sanitary authorities, and the contract's own conditions
    needs: [CITES route, or the ANLA No-CITES procedure with tariff under Res. 0921/2025, or a documented exemption, then ICA and sanitary layers]
    gives: Lawful export, checked against the contract's transfer conditions
    requirements:
      - id: export_route
        text: Which export route. The CITES route where the specimen is CITES-listed; the ANLA No-CITES import and export procedure for biological-diversity specimens not listed in CITES, subject to statutory exemptions, with a tariff under Res. 0921/2025; or a documented exemption, recorded with its basis.
        reg: { state: "established", marker: "§", value: "Three routes, decided by CITES listing and whether an exemption is documented.", citation: "Res. 0921/2025" }
      - id: sanitary_layers
        text: Then the ICA and sanitary layers, on every route.
        reg: { state: "established", marker: "§", value: "ICA and sanitary requirements." }
      - id: contract_transfer_terms
        text: D391 Art. 17 contemplates contract terms governing transfer of accessed material to third parties. Store them on the contract object and check before any export or sublicense.
        reg: { state: "established", marker: "§", value: "Art. 17.", citation: "D391 Art. 17" }
  - id: continuity
    title: What attaches to the contract (phase two)
    subject: platform
    informational: true
    trig: Contract perfected
    who: The applicant, the national support institution, MADS
    needs: []
    gives: Duties recorded on the contract, not run by the MVP
    requirements:
      - id: journey_does_not_end
        text: Execution, progress and final reports, follow-up, and the Art. 43 monitoring duties on the national support institution all continue.
        reg: { state: "inferred", marker: "▸", value: "Those parameters live in the obligation classes, not in the pathway." }

stateMachine:
  initial: preparing
  states:
    preparing: { label: Preparing application (Art. 26), kind: active }
    filed: { label: Filed with the environmental authority, kind: waiting }
    returned_incomplete:
      label: Returned incomplete
      kind: active
      reg: { state: "established", marker: "§", value: "Model incomplete, information requested and resubmitted as real states.", citation: "D391 Art. 27" }
    information_requested: { label: Information requested, kind: active }
    resubmitted: { label: Resubmitted, kind: waiting }
    admitted: { label: Admitted and registered (Art. 27). The Art. 29 clock starts, kind: waiting }
    published: { label: Published in two media, kind: waiting }
    evaluated: { label: "Under evaluation (30 working days from registration, extendable by up to 60)", kind: waiting }
    accepted:
      label: Accepted. Five working days to notify. Acceptance is not a contract.
      kind: active
      reg: { state: "established", marker: "§", value: "Art. 30.", citation: "D391 Art. 30" }
    notification_overdue:
      label: Acceptance not notified within five working days. Remedy against the administrator; the acceptance stands.
      kind: halted
      outcome: lapsed
      reg: { state: "established", marker: "§", value: "The five-day deadline attaches to notifying the acceptance, not to deciding. A late notification is a remedy against the administrator. It neither undoes the acceptance nor creates a contract.", citation: "D391 Art. 30" }
    negotiating: { label: Contract negotiation with MADS, kind: active }
    perfected:
      label: Contract perfected on publication
      kind: terminal
      outcome: granted
      reg: { state: "established", marker: "§", value: "Art. 38.", citation: "D391 Art. 38" }
    denied:
      label: Denied by reasoned resolution. Recurso de reposición contemplated.
      kind: terminal
      outcome: refused
    appealed: { label: Recurso de reposición filed, kind: waiting }
    terminated:
      label: Terminated
      kind: terminal
      outcome: none
      reg: { state: "established", marker: "§", value: "Where an indispensable accessory contract fails, the authority may terminate. Discretionary.", citation: "D391 Art. 44" }
    withdrawn: { label: Withdrawn by applicant, kind: terminal, outcome: withdrawn }
    deadline_lapsed:
      label: Evaluation clock lapsed. Remedy against the administrator, no contract.
      kind: halted
      outcome: lapsed
  transitions:
    - { from: preparing, to: filed, event: submit, actor: applicant }
    - { from: filed, to: returned_incomplete, event: return_incomplete, actor: authority }
    - { from: returned_incomplete, to: resubmitted, event: resubmit, actor: applicant }
    - { from: resubmitted, to: filed, event: refile, actor: system }
    - { from: filed, to: admitted, event: admit, actor: authority }
    - { from: admitted, to: published, event: publish, actor: authority }
    - { from: published, to: evaluated, event: begin_evaluation, actor: authority }
    - { from: evaluated, to: information_requested, event: request_information, actor: authority }
    - { from: information_requested, to: evaluated, event: resubmit, actor: applicant }
    - { from: evaluated, to: accepted, event: accept, actor: authority }
    - { from: evaluated, to: denied, event: deny, actor: authority }
    - { from: denied, to: appealed, event: appeal, actor: applicant }
    - { from: appealed, to: accepted, event: uphold_appeal, actor: authority }
    - { from: appealed, to: denied, event: dismiss_appeal, actor: authority }
    - { from: accepted, to: negotiating, event: begin_negotiation, actor: authority }
    - { from: negotiating, to: perfected, event: publish_contract, actor: authority }
    - { from: perfected, to: terminated, event: terminate, actor: authority }
    - { from: preparing, to: withdrawn, event: withdraw, actor: applicant }
    - { from: filed, to: withdrawn, event: withdraw, actor: applicant }
    - { from: evaluated, to: withdrawn, event: withdraw, actor: applicant }
    - { from: negotiating, to: withdrawn, event: withdraw, actor: applicant }
    # Desistimiento: withdrawal is open wherever the application is still pending.
    - { from: returned_incomplete, to: withdrawn, event: withdraw, actor: applicant, reg: { state: "inferred", marker: "▸", value: "An applicant may withdraw an application at any point before the decision. General administrative law; Appendix B does not address it." } }
    - { from: resubmitted, to: withdrawn, event: withdraw, actor: applicant, reg: { state: "inferred", marker: "▸", value: "An applicant may withdraw an application at any point before the decision. General administrative law; Appendix B does not address it." } }
    - { from: information_requested, to: withdrawn, event: withdraw, actor: applicant, reg: { state: "inferred", marker: "▸", value: "An applicant may withdraw an application at any point before the decision. General administrative law; Appendix B does not address it." } }
    - { from: admitted, to: withdrawn, event: withdraw, actor: applicant, reg: { state: "inferred", marker: "▸", value: "An applicant may withdraw an application at any point before the decision. General administrative law; Appendix B does not address it." } }
    - { from: published, to: withdrawn, event: withdraw, actor: applicant, reg: { state: "inferred", marker: "▸", value: "An applicant may withdraw an application at any point before the decision. General administrative law; Appendix B does not address it." } }
    - { from: accepted, to: withdrawn, event: withdraw, actor: applicant, reg: { state: "inferred", marker: "▸", value: "An applicant may withdraw an application at any point before the decision. General administrative law; Appendix B does not address it." } }
    - { from: notification_overdue, to: withdrawn, event: withdraw, actor: applicant, reg: { state: "inferred", marker: "▸", value: "An applicant may withdraw an application at any point before the decision. General administrative law; Appendix B does not address it." } }
    - { from: admitted, to: deadline_lapsed, event: lapse, actor: system }
    - { from: published, to: deadline_lapsed, event: lapse, actor: system }
    - { from: evaluated, to: deadline_lapsed, event: lapse, actor: system }
    - { from: deadline_lapsed, to: evaluated, event: administrator_resumes, actor: authority }
    - { from: accepted, to: notification_overdue, event: lapse, actor: system }
    - { from: notification_overdue, to: negotiating, event: begin_negotiation, actor: authority }
  clocks:
    - id: evaluation
      label: Evaluation clock (Art. 29, 30 working days from registration)
      startsIn: admitted
      # "Dentro de los treinta días hábiles siguientes al registro": publication (Art. 28) runs inside it.
      runsIn: [admitted, published, evaluated]
      days: 30
      dayKind: working
      extendableDays: 60
      extension: { state: "established", marker: "§", value: "Dicho plazo será prorrogable hasta por sesenta días hábiles, a juicio de la Autoridad Nacional Competente. At the authority's discretion, up to 60 working days in total.", citation: "D391 Art. 29" }
      suspendsIn: [information_requested]
      onLapse:
        to: deadline_lapsed
        effect: remedy_against_administrator
        reg: { state: "established", marker: "§", value: "A missed statutory deadline gives a remedy against the administrator. It does not grant the contract.", citation: "Appendix B, R8" }
    - id: acceptance_notice
      label: Five working days to notify an acceptance (Art. 30, "cinco días hábiles")
      startsIn: accepted
      days: 5
      dayKind: working
      onLapse:
        to: notification_overdue
        effect: remedy_against_administrator
        reg: { state: "established", marker: "§", value: "The deadline attaches to notifying acceptance, not to making the decision. Art. 30 counts it in working days (días hábiles).", citation: "D391 Art. 30" }

# Días hábiles skip the weekend and Colombia's public holidays, most of which move to the following
# Monday under Ley Emiliani. Ley 2578 of 2026 added the Virgen de Chiquinquirá (9 July, observed Monday).
calendar:
  weekend: [6, 7]
  coversThrough: "2027-12-31"
  reg:
    state: inferred
